name: Combined unit and integration coverage
on:
  push:
    branches: [main]
    paths: ['scripts/**','tests/**','config/integration-pins.json','requirements-integration.txt','.github/workflows/combined-coverage.yml']
  pull_request:
    paths: ['scripts/**','tests/**','config/integration-pins.json','requirements-integration.txt','.github/workflows/combined-coverage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Gacky-Lab/LYRIC-DESIGN-FRAMEWORK
          ref: a748dc43a25632e90fa997428f2726778fd883d0
          path: upstream/lyric
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Gacky-Lab/SUNO-GENERATION-OPTIMIZER
          ref: 41a89bd345a5f26689393c1999c7c9e9e0ef9898
          path: upstream/suno
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Gacky-Lab/AI-VOCALOID-STUDIO
          ref: bd444e277b3819a9a9981352306b9e4fca5ff363
          path: upstream/vocaloid
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Gacky-Lab/AI-MUSIC-INTELLIGENCE-ENGINE
          ref: aca0837bfef4f7f0820bfffadea442eedc136cf0
          path: upstream/mir
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-integration.txt coverage==7.8.0
      - run: mkdir -p out/coverage
      - run: python -m coverage run --branch --source=scripts -m unittest discover -s tests -v
      - run: python -m coverage json -o out/coverage/unit.json
      - run: python -m coverage run --branch --append --source=scripts scripts/integration_runner.py --upstream upstream --output out/coverage-run
      - run: python -m coverage report
      - run: python -m coverage json -o out/coverage/combined.json
      - name: Print scoped coverage summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('unit','combined'):
              data=json.loads(Path(f'out/coverage/{name}.json').read_text())
              t=data['totals']
              print(name, json.dumps({k:t[k] for k in ('num_statements','covered_lines','missing_lines','num_branches','covered_branches','percent_covered')}))
              f=data['files']['scripts/integration_runner.py']['summary']
              print('integration_runner',name,json.dumps(f))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-coverage
          path: out/coverage/
