name: Cross-repository evidence smoke
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'remotion/**', '.github/workflows/cross-repo-smoke.yml']
  pull_request:
    paths: ['scripts/**', 'remotion/**', '.github/workflows/cross-repo-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Gacky-Lab/LYRIC-DESIGN-FRAMEWORK
          ref: d13b8e7c2a2b763256b6f234b756951dab872bd9
          path: upstream/lyric
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Gacky-Lab/AI-MUSIC-INTELLIGENCE-ENGINE
          ref: 6337f65ee5fb2c28558cea83c23266e2e0b51206
          path: upstream/mir
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/cross_repo_smoke.py --lyric-repo upstream/lyric --mir-repo upstream/mir
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: fc-match -f '%{family}\n' 'Noto Sans CJK JP' | grep -F 'Noto Sans CJK JP'
      - run: npm install --no-audit --no-fund
        working-directory: remotion
      - run: python scripts/lyric_preview.py --wav out/p1-fixture/source.wav --lyrics out/cross-repo/handoff.json --timing out/cross-repo/timing.json --mir out/cross-repo/evidence.json --output-dir out/japanese-preview --authorized-local-preview
      - run: python scripts/verify_japanese_render.py --video out/japanese-preview/preview.mp4 --reference out/cross-repo/excerpt.wav --output out/japanese-preview/quality.json
      - run: ffmpeg -v error -ss 2.5 -i out/japanese-preview/preview.mp4 -frames:v 1 out/japanese-preview/sample.png
      - uses: actions/upload-artifact@v4
        with:
          name: cross-repo-evidence
          if-no-files-found: error
          path: |
            out/cross-repo/report.json
            out/japanese-preview/report.json
            out/japanese-preview/quality.json
            out/japanese-preview/preview.mp4
            out/japanese-preview/sample.png
            remotion/package-lock.json
